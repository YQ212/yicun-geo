name: GEO Daily

permissions:
  contents: write
  pages: write
  id-token: write

on:
  schedule:
    - cron: '7 1 * * *'
    - cron: '0 2 1 * *'
  workflow_dispatch:

concurrency:
  group: geo-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate project directory
        run: |
          if [ -f requirements.txt ]; then
            echo "PROJ_DIR=." >> "$GITHUB_ENV"
          elif [ -f geo-automation/requirements.txt ]; then
            echo "PROJ_DIR=geo-automation" >> "$GITHUB_ENV"
          else
            echo "找不到 requirements.txt，仓库根目录内容如下："
            ls -la
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        working-directory: ${{ env.PROJ_DIR }}
        run: pip install -r requirements.txt
      - name: Generate + publish
        working-directory: ${{ env.PROJ_DIR }}
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          if [ -n "$LLM_API_KEY" ]; then
            cp config.example.json config.json
            python3 - <<'PY'
          import json, os
          c = json.load(open('config.json'))
          c['llm']['enabled'] = True
          c['llm']['api_key'] = os.environ['LLM_API_KEY']
          json.dump(c, open('config.json','w'), ensure_ascii=False, indent=2)
          PY
          fi
          python3 generate.py
          python3 publish.py
      - name: Commit generated content
        working-directory: ${{ env.PROJ_DIR }}
        run: |
          git config user.name "geo-bot"
          git config user.email "geo@yicun.local"
          git add output
          git commit -m "geo: daily content $(date +%F)" || echo "no changes"
          git push
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PROJ_DIR }}/output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  diagnose:
    if: github.event.schedule == '0 2 1 * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate project directory
        run: |
          if [ -f requirements.txt ]; then
            echo "PROJ_DIR=." >> "$GITHUB_ENV"
          elif [ -f geo-automation/requirements.txt ]; then
            echo "PROJ_DIR=geo-automation" >> "$GITHUB_ENV"
          else
            echo "找不到 requirements.txt，仓库根目录内容如下："
            ls -la
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Monthly diagnose
        working-directory: ${{ env.PROJ_DIR }}
        run: |
          pip install -r requirements.txt
          python3 diagnose.py || true
